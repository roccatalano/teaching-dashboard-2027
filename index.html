<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teaching dashboard 2027</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f1e1c;--muted:#6b6a65;--line:#e2e0d8;--accent:#2f5fd0;
--lesson:#eef3fd;--lesson-i:#1d4596;--prac:#e6f5ee;--prac-i:#0f6e56;--sac:#fcebeb;--sac-i:#a32d2d;
--review:#faeeda;--review-i:#854f0b;--other:#f1efe8;--other-i:#5f5e5a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.top{position:sticky;top:0;z-index:5}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;font-weight:600;margin:0 12px 0 0}
.tabs button,.ctl button,.ctl select{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
.subbar{background:#fbfaf6;border-bottom:1px solid var(--line);padding:6px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.subbar .toggle{margin:0;border:0;border-radius:0;gap:2px}.subbar .toggle button{border-radius:6px;padding:5px 14px;color:var(--muted)}
.subbar .toggle button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.ctable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.ctable th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fbfaf6;padding:8px 10px;border-bottom:1px solid var(--line)}
.ctable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}.ctable tr:last-child td{border-bottom:0}
.ctable select,.ctable textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--card)}.ctable textarea{width:100%;min-height:36px;font-size:13px}
.ctable td details{font-size:13px}.ctable td details ul{margin:4px 0;padding-left:18px}
.st-written{color:var(--prac-i)}.st-drafting{color:var(--review-i)}.st-planned{color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:16px 20px 80px}
.unit{font-size:20px;font-weight:600;margin:28px 0 4px}
.aos{margin:18px 0 8px;padding:6px 0;border-top:2px solid var(--ink);display:flex;justify-content:space-between;gap:12px}
.aos b{font-size:15px}.aos span{color:var(--muted)}
.week{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.week.now .wl b{color:var(--accent)}
.wl{padding-top:6px;color:var(--muted);font-size:12px}.wl b{display:block;color:var(--ink);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:9px 11px;cursor:pointer;min-height:78px;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}
.card.open{outline:2px solid var(--accent)}
.meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.ttl{font-weight:500;line-height:1.3}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:auto}.bar i{display:block;height:100%;background:var(--prac-i);border-radius:4px}
.t-lesson{--c:var(--lesson-i)}.t-prac{--c:var(--prac-i)}.t-sac{--c:var(--sac-i)}.t-review{--c:var(--review-i)}.t-holiday{--c:#2f9e8f}
.card.t-tbc{--c:var(--line);border-style:dashed;background:transparent;color:var(--muted)}.t-tbc .tag{--b:var(--other);--c:var(--muted)}
.card.span3{grid-column:span 3;align-items:center;justify-content:center;text-align:center;min-height:90px}.card.span3 .ttl{font-size:17px;font-weight:600}.card.span3 .meta,.card.span3 .bar{display:none}
.t-consolidation,.t-buffer,.t-options,.t-investigation{--c:var(--other-i)}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--b);color:var(--c)}
.t-lesson .tag{--b:var(--lesson)}.t-prac .tag{--b:var(--prac)}.t-sac .tag{--b:var(--sac)}.t-review .tag{--b:var(--review)}.t-holiday .tag{--b:#e0f4f0}
.t-consolidation .tag,.t-buffer .tag,.t-options .tag,.t-investigation .tag{--b:var(--other)}
.detail{grid-column:2/-1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.detail h2{font-size:17px;margin:0 0 2px}.detail h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px}
.katex{font-size:1.05em;white-space:nowrap}
.detail ul{margin:0;padding-left:18px;line-height:1.55}
.detail label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.detail textarea{width:100%;min-height:70px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
.toggle{display:inline-flex;margin:16px 0 2px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.toggle button{font:inherit;border:0;background:var(--card);padding:6px 16px;cursor:pointer}.toggle button.on{background:var(--ink);color:#fff}
.ovbtn{font:inherit;font-size:12px;margin-left:10px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 10px;cursor:pointer}
.ov{background:#fbfaf6;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 14px;display:grid;grid-template-columns:1fr 1.3fr;gap:20px}
.ov h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px}.ov ol,.ov ul{margin:0;padding-left:20px;line-height:1.55}
@media(max-width:760px){.ov{grid-template-columns:1fr}}
.nest{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--card)}
.nest>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.nest>summary::-webkit-details-marker{display:none}.nest>summary:after{content:"▾";font-size:12px;transition:transform .15s}.nest:not([open])>summary:after{transform:rotate(-90deg)}
.nest>summary .cnt{font-weight:400;text-transform:none;letter-spacing:0;margin-left:auto;margin-right:8px}
.nest>.nb{padding:0 14px 12px;font-size:13px;line-height:1.55}.nest .nb ul{margin:4px 0;padding-left:18px}.nest .nb h4{margin:8px 0 2px;font-size:12px;color:var(--ink)}
.nest.n-mat{border-color:#2f9e8f;background:#f0faf8}.nest.n-mat>summary{color:#1d7266}.mat{margin:4px 0;padding-left:0;list-style:none}.mat li{padding:5px 0;border-bottom:1px dashed #cfe9e4}.mat li:last-child{border-bottom:0}.mat .mrow{display:flex;align-items:center;gap:4px}.mat .mrow .ms{margin:0 0 0 auto}.mat .ms{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:8px;margin-right:4px;background:#e4e4e4;color:#555}.mat .ms.draft{background:#fbe7b5;color:#7a5a00}.mat .mlink{font-size:11.5px;font-weight:600;color:#1d7266;text-decoration:none;border:1px solid #9fd8cd;border-radius:8px;padding:1px 7px;margin-left:2px}.mat .mlink:hover{background:#c9eedf}.mat .ms.ready{background:#c9eedf;color:#14684f}.nest.n-cfat{border-color:#8a6ad8;background:#f7f4fe}.nest.n-cfat>summary{color:#5b3fb0}
.wedo{margin:4px 0;padding-left:0;list-style:none}.wedo li{padding:6px 0;border-bottom:1px dashed var(--line)}.wedo li:last-child{border-bottom:0}.wedo .ytry{font-size:12px;color:var(--prac-i);margin-top:2px}.apk{margin:4px 0;padding-left:0;list-style:none}.apk li{padding:5px 0;border-bottom:1px dashed var(--line)}.apk li:last-child{border-bottom:0}.apk .ak{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--line);margin-right:4px}.apk .ak.ex{background:#f3e3c3}.wedo .cgo{display:inline-block;font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap}.wedo .ytry.none{color:var(--muted);font-style:italic}
.sk{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--bg)}.sk>summary{list-style:none;cursor:pointer;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;font-weight:500}
.sk>summary>span:first-child{flex:1;text-align:left}.sk>summary::-webkit-details-marker{display:none}.sk>summary .cnt{font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}.sk>summary:before{content:"▸";margin-right:4px;color:var(--muted)}.sk[open]>summary:before{content:"▾"}
.sk .casg{padding:0 10px 6px}.casg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.casg h4{margin:6px 0 6px}@media(max-width:760px){.casg{grid-template-columns:1fr}}
.vid{margin-bottom:10px}.vid .vt{font-size:12px;line-height:1.35;margin:4px 0 2px}.vid a{font-size:12px}
.yt{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;cursor:pointer;border:0;padding:0}
.yt img{width:100%;height:100%;object-fit:cover;opacity:.85}.yt:after{content:"▶";position:absolute;inset:0;margin:auto;width:46px;height:32px;border-radius:8px;background:#c4302b;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.yt.on:after{display:none}.yt iframe{width:100%;height:100%;border:0}
.pracbox{margin-top:14px;border:1.5px solid var(--prac-i);background:var(--prac);border-radius:10px;padding:10px 14px}.pracbox ul{margin:6px 0;padding-left:18px}
.tags{display:flex;gap:4px}.tag.cfat{background:#efe9fb;color:#5b3fb0;font-weight:600}
.card.has-cfat{box-shadow:inset 0 -3px 0 #8a6ad8}
.cfx{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}.cfx th{text-align:left;font-weight:600;color:#5b3fb0;border-bottom:1.5px solid #cfc2f0;padding:3px 4px}.cfx td{border-bottom:1px solid #e6def9;padding:3px 4px;vertical-align:top}.cfx td:first-child{white-space:nowrap}.cfx td.n{text-align:center;font-weight:600}.cfx-sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px}.cfx-sum span{background:#efe9fb;color:#5b3fb0;border-radius:8px;padding:1px 8px}.cfx-sum .cfx-pill{font-weight:700;background:#8a6ad8;color:#fff}.cfatbox{margin-top:14px;border:1.5px solid #8a6ad8;background:#f7f4fe;border-radius:10px;padding:10px 14px}.cfatbox h3{margin-top:10px}.cfatbox summary{cursor:pointer;font-size:14px}
.arules,.acard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px 0}
.arules h3,.acard h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px}
.arules ul,.acard ul{margin:0;padding-left:18px;line-height:1.6}.acard p{margin:0;line-height:1.5}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:15px}
.agrid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}.goto{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 10px;cursor:pointer}
.src{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--other);color:var(--other-i)}.src-cambridge{background:var(--prac);color:var(--prac-i)}.src-mr{background:var(--lesson);color:var(--lesson-i)}.src-pearson{background:var(--review);color:var(--review-i)}
.nosol{color:var(--sac-i)}.gaps li{color:var(--review-i)}details summary{cursor:pointer}
@media(max-width:760px){.agrid{grid-template-columns:1fr}}
.seq{border-left:1px solid var(--line);padding-left:22px}
.seqhead{display:flex;justify-content:space-between;align-items:baseline}
.seqempty{color:var(--muted);font-style:italic;border:1px dashed var(--line);border-radius:10px;padding:30px;text-align:center}
.goals{background:var(--lesson);color:var(--lesson-i);border-radius:8px;padding:8px 12px;font-size:13px}.goals ul{margin:4px 0 0;padding-left:18px}
.steps{list-style:none;padding:0;margin:10px 0 0}
.step{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.stime{font-size:12px;font-weight:600;color:var(--ink)}.stime span{font-weight:400;color:var(--muted)}
.sphase{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--c,var(--muted));font-weight:600}
.stitle{font-weight:500}.sdetail{font-size:13px;line-height:1.5;margin-top:2px}.sres{font-size:12px;color:var(--muted);margin-top:4px}.sres:before{content:"Resources: "}
.donow{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.5}.donow li{margin-bottom:4px}
.ph-apk{--c:#b5487a}.ph-learning,.ph-course{--c:var(--muted)}
.ph-do-now{--c:var(--review-i)}.ph-new{--c:var(--lesson-i)}.ph-guided{--c:var(--lesson-i)}.ph-apply{--c:var(--prac-i)}.ph-exit{--c:#5b3fb0}
.vocab{display:flex;flex-wrap:wrap;gap:5px}.vocab span{font-size:12px;background:var(--other);border-radius:6px;padding:2px 8px}
@media(max-width:760px){.seq{border-left:0;padding-left:0}}
.sub{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-style:italic}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:flex;gap:5px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.placeholder{background:var(--card);border:1px dashed var(--muted);border-radius:12px;padding:40px;text-align:center;color:var(--muted);margin-top:30px}
@media(max-width:760px){.week{grid-template-columns:1fr}.detail{grid-column:1;grid-template-columns:1fr}}

.ph-cfat{--c:#5b3fb0}.ph-prac,.ph-analysis{--c:var(--prac-i)}.ph-pre-lab,.ph-logbook{--c:var(--review-i)}
.res{margin:0;padding-left:18px;line-height:1.55}.res .path{display:block;font-size:11px;color:var(--muted);word-break:break-all}
.teach{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px}.teach h3{margin-top:0}
.scope{font-size:12px;color:var(--muted)}
.wdates{display:block;font-size:12px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div class="top">
<header>
  <h1>Teaching dashboard 2027</h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="subbar" id="subbar">
  <div class="toggle" id="viewtog"></div>
  <div class="ctl" id="ctl">
    <select id="aosFilter"><option value="">All areas of study</option></select>
    <button id="expand">Expand all</button>
  </div>
</div>
</div>
<main id="main"></main>
<script>
const CLASSES=[{id:'physics-11',name:'11 Physics',file:'classes/physics-11.json'},{id:'general-maths-12',name:'12 General Maths',file:'classes/general-maths-12.json'}];
const TYPE={holiday:'Holiday',lesson:'Lesson',prac:'Prac',sac:'Assessment',review:'Review',tbc:'To be planned'};
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let data={},tab=store.get('tab','physics-11'),view=store.get('view','plan'),openId=null,expandAll=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state=id=>store.get('st:'+id,{}), setState=(id,s)=>store.set('st:'+id,s);
const cfs=l=>l.cfats||(l.cfat?[l.cfat]:[]);
function tasksOf(l){const s=state(l.id);return l.tasks.map((t,i)=>({...t,done:s.done?.[i]??t.done}))}
function progress(l){const t=tasksOf(l);return t.length?t.filter(x=>x.done).length/t.length:0}
function list(arr,empty){return arr&&arr.length?`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<div class="empty">${empty||'None'}</div>`}
function link(r){if(!r)return '';return r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a>`:esc(r.label)}
function res(arr){return arr&&arr.length?`<ul class="res">${arr.map(r=>`<li>${link(r)}${r.path?`<span class="path">${esc(r.path)}</span>`:''}</li>`).join('')}</ul>`:'<div class="empty">None</div>'}
function typeset(){if(window.renderMathInElement)renderMathInElement($('#main'),{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false})}
function renderTabs(){
  $('#tabs').innerHTML=[...CLASSES.map(c=>`<button data-t="${c.id}" class="${tab==c.id?'on':''}">${c.name}</button>`),`<button data-t="schedule" class="${tab=='schedule'?'on':''}">Schedule</button>`].join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;store.set('tab',tab);render()});
}
function cfatDetails(c){const Q=c.questions||[];
  const summ=`<div class="cfx-sum"><span class="cfx-pill">/${c.marks||'?'}</span>${c.mcMarks!=null?`<span>MC ${c.mcMarks}</span><span>Short answer ${c.saMarks}</span>`:''}<span>${esc(c.format||'')}</span></div>`;
  const bySub=c.bySub?.length?`<h3>Marks by subchapter &amp; success criteria</h3><table class="cfx"><tr><th>Sub</th><th>Marks</th><th>Success criteria tested</th></tr>${c.bySub.map(b=>`<tr><td><b>${esc(b.sub)}</b></td><td class="n">${b.marks}</td><td>${b.sc.map(esc).join('<br>')}</td></tr>`).join('')}</table>`:'';
  const bySd=c.bySd?.length?`<h3>Study Design coverage</h3><table class="cfx"><tr><th>Code</th><th>Dot point</th><th>Marks</th><th>Qs</th></tr>${c.bySd.map(b=>`<tr><td><b>${esc(b.code)}</b></td><td>${esc(b.text)}</td><td class="n">${b.marks}</td><td>${esc(b.qs.join(', '))}</td></tr>`).join('')}</table>`:'';
  const qs=Q.length?`<h3>Question breakdown</h3><table class="cfx"><tr><th>Q</th><th>Mk</th><th>Skill</th><th>Study Design</th><th>Sub</th><th>Follow-up if wrong</th></tr>${Q.map(x=>`<tr><td><b>${esc(String(x.q))}</b> <span class="sub">${x.type}</span></td><td class="n">${x.marks}</td><td>${esc(x.skill)}<div class="sub">${esc(x.src)}</div></td><td>${esc(x.sd.join(', '))}</td><td>${esc(x.sub)}</td><td>${x.fu?esc(x.fu):'<span class="sub">TBC</span>'}</td></tr>`).join('')}</table>`:'';
  return `<div><div class="ttl"><b>${esc(c.id)}</b> · ${esc(c.title)}</div>${summ}
  ${bySub}${bySd}${qs}</div>`}
function cfatBox(c){return `<details class="cfatbox"><summary><b>${esc(c.id)}</b> · ${esc(c.title)} <span class="sub">· ${esc(c.format)}</span></summary>
  <div class="meta" style="margin-top:8px"><span>Covers ${esc(c.covers.join(', '))}</span></div>
  <div style="font-size:13px;margin-top:4px">${esc(c.plan)}</div><h3>Sources</h3>${list(c.sources)}</details>`}
function pracBox(p){
  return `<div class="pracbox"><div class="meta"><span>THIS WEEK’S PRAC</span><span class="src src-pearson">${esc(p.kind)}${p.code?' '+esc(p.code):''}</span></div>
    <div class="ttl">${esc(p.title)}</div>
    ${p.student?`<h3>For students</h3>${res([p.student,...(p.extra?[p.extra.student]:[])])}`:''}
    ${p.teacher&&p.teacher.length?`<h3>Teacher</h3>${res([...p.teacher,...(p.extra?p.extra.teacher:[])])}`:''}
    <div class="sub" style="margin-top:6px">Logbook: date, aim, risks, method, raw data, analysis, reflection.</div></div>`}
function pearsonPane(l){
  return `${l.read?`<h3>Read</h3><div>${esc(l.read)}</div>`:''}
    ${l.questions?.length?`<h3>Student book questions</h3>${list(l.questions)}`:''}
    ${l.videos?.length?`<h3>Videos</h3>${res(l.videos)}`:''}
    ${l.experiments?.length&&l.type=='lesson'?`<h3>Optional online experiments (not in a prac slot)</h3>${res(l.experiments)}`:''}
    ${l.otherPracs?.length?`<h3>Other Pearson pracs for this topic (not scheduled)</h3>${res(l.otherPracs)}`:''}
    ${l.solutions?`<div class="teach"><h3>Teacher: answers</h3>${res([l.solutions])}</div>`:''}
    ${l.note?`<h3>Note</h3><div>${esc(l.note)}</div>`:''}`}
function seqPane(l){const q=l.sequence;
  if(!q)return `<div class="seqempty">Guided lesson sequence not written yet</div>`;
  let t=0;
  return `<div class="seqhead"><h3 style="margin-top:0">Guided lesson sequence</h3><span class="sub">${q.length} min</span></div>
    <div class="goals"><b>Learning goals: I can…</b><ul>${q.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>
    <ol class="steps">${q.steps.map(s=>{const st=t;t+=s.min;return `<li class="step ph-${s.phase.split(' ')[0].toLowerCase()}">
      <div class="stime">${st}–${t}<br><span>${s.min} min</span></div>
      <div><div class="sphase">${esc(s.phase)}</div><div class="stitle">${esc(s.title)}</div><div class="sdetail">${esc(s.detail)}</div>
      ${s.phase=='Do-now'&&q.doNow?.length?`<ul class="donow">${q.doNow.map(x=>`<li><b>${esc(x.when)}</b>${x.note?` <span class="sub">(${esc(x.note)})</span>`:''}<br>${esc(x.q)}</li>`).join('')}</ul>`:''}
      ${s.phase=='Guided practice'&&q.weRefs?.length?`<ul class="donow">${q.weRefs.map(x=>`<li><b>Worked example ${esc(x.n)}</b> + Try yourself · ${esc(x.label)} <span class="sub">(SB p. ${x.page})</span></li>`).join('')}</ul>`:''}
      ${s.phase=='Exit ticket'&&q.exitQs?.length?`<ol class="donow">${q.exitQs.map(x=>`<li><span class="sub">${esc(x.note)}</span><div style="white-space:pre-line">${esc(x.q)}</div></li>`).join('')}</ol>`:''}
      ${s.resource?`<div class="sres">${esc(s.resource)}</div>`:''}</div></li>`}).join('')}</ol>
    <h3>Vocabulary</h3><div class="vocab">${q.vocab.map(v=>`<span>${esc(v)}</span>`).join('')}</div>`}
const nestOpen=k=>store.get('nest:'+k,false);
function nest(k,title,body,cnt,cls){return body?`<details class="nest ${cls||''}" data-nest="${k}" ${nestOpen(k)?'open':''}><summary>${title}${cnt!=null?`<span class="cnt">${cnt}</span>`:''}</summary><div class="nb">${body}</div></details>`:''}
function grouped(arr){return (arr||[]).map(g=>`<h4>${esc(g.sub)}</h4>${list(g.items)}`).join('')}
function nests(l){const c=cfs(l),n=a=>(a||[]).reduce((t,g)=>t+(g.items?g.items.length:1),0);
  return nest('mat','Lesson materials',l.materials?.length?`<ul class="mat">${l.materials.map(x=>`<li><div class="mrow"><b>${esc(x.kind)}</b>${x.file?` · <a class="mlink" href="${esc(x.file)}" target="_blank" rel="noopener">Open ↗</a>`:''}${x.pdf?` <a class="mlink pdf" href="${esc(x.pdf)}" download>PDF ⬇</a>`:''}<span class="ms ${x.status}">${x.status=='ready'?'Ready':x.status=='draft'?'Draft':'To make'}</span></div><div class="sub">${esc(x.desc)}</div></li>`).join('')}</ul>`:'',l.materials?.filter(x=>x.status=='ready').length+'/'+l.materials?.length,'n-mat')
   +nest('cfat',c.length>1?'CFAT details · '+c.length+' CFATs':'CFAT details',c.map(cfatDetails).join('<hr style="border:0;border-top:1px solid #d9cff5">'),c.map(x=>x.id).join(', '),'n-cfat')
   +nest('lo','Learning objectives',l.learningObjectives?.length?grouped(l.learningObjectives):'',n(l.learningObjectives))
   +nest('sc','Success criteria',l.successCriteria?.length?grouped(l.successCriteria):'',n(l.successCriteria))
   +nest('sd','Study Design',l.studyDesign?.length?list(l.studyDesign):'',l.studyDesign?.length)
   +nest('voc','Key vocabulary',l.keyVocab?.length?`<ul>${l.keyVocab.map(v=>{const i=v.indexOf(': ');return `<li>${i>0?`<b>${esc(v.slice(0,i))}</b>: ${esc(v.slice(i+2))}`:esc(v)}</li>`}).join('')}</ul>`:'',l.keyVocab?.length)
   +nest('cas','CAS skills',l.cas?.length?l.cas.map(k=>`<details class="sk"><summary><span>${esc(k.skill)}</span><span class="cnt">${[k.classpad.length?'ClassPad '+k.classpad.length:'',k.ti.length?'TI '+k.ti.length:''].filter(Boolean).join(' · ')}</span></summary><div class="casg"><div><h4>Casio ClassPad</h4>${vids(k.classpad)}</div><div><h4>TI-nspire</h4>${vids(k.ti)}</div></div></details>`).join(''):'',l.cas?.length)
   +nest('donow','Do Now',l.doNow?.length?`<ul class="apk">${l.doNow.map(x=>`<li><span class="ak ex">${esc(x.exam)}</span> ${esc(x.ref)}</li>`).join('')}</ul>`:'',l.doNow?.length)
   +nest('apk','APK (prior knowledge)',l.apk?.length?`<ul class="apk">${l.apk.map(x=>`<li><span class="ak ${x.kind=='Exam'?'ex':''}">${x.kind=='Exam'?'Exam Q':'Skill'}</span> ${esc(x.text)}<div class="sub">${esc(x.ref)}</div></li>`).join('')}</ul>`:'',l.apk?.length)
   +nest('wedo','Worked examples &amp; you trys',l.weDo?.length?`<ol class="wedo">${l.weDo.map(x=>`<li><span class="sub">${esc(x.sub)}</span> <b>Example ${x.n}</b> · ${esc(x.title)}${x.video?`<span class="cgo" title="${esc(x.video)}">▶ video</span>`:''}<div class="${x.youTry&&x.youTry!='TBM'?'ytry':'ytry none'}">${x.youTry=='TBM'?'You try: to be mapped':x.youTry?'You try: '+esc(x.youTry):'No you try'}</div></li>`).join('')}</ol>${l.weDoNote?`<div class="sub">${esc(l.weDoNote)}</div>`:''}`:'',l.weDo?.length)
   +nest('exit','Exit tasks',l.exit?.length?`<ul class="apk">${l.exit.map(x=>`<li><span class="ak ex">${/Exam 1/.test(x.src)?'Exam 1':'Exam 2'}</span> ${esc(x.ref)}<div class="sub">${esc(x.src)}</div></li>`).join('')}</ul>`:'',l.exit?.length)}
const ytId=u=>{const m=String(u).match(/[?&]v=([\w-]{11})/)||String(u).match(/youtu\.be\/([\w-]{11})/);return m?m[1]:''};
const ytStart=u=>{const m=String(u).match(/[?&]t=(\d+)/);return m?m[1]:''};
function vids(arr){return (arr||[]).map(v=>{const id=ytId(v.url);return `<div class="vid"><button class="yt" data-yt="${id}" data-start="${ytStart(v.url)}" aria-label="Play ${esc(v.title)}"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt=""></button><div class="vt">${esc(v.title)}</div><a href="${esc(v.url)}" target="_blank" rel="noopener">Open on YouTube ↗</a></div>`}).join('')||'<div class="empty">No video</div>'}
function detail(l){
  const t=tasksOf(l),s=state(l.id);
  return `<div class="detail" data-for="${l.id}"><div>
    <div class="meta"><span>${esc(l.aos)} · ${esc(l.weekLabel||'Week '+l.week)}${l.termLabel?' ('+esc(l.termLabel)+')':''} · Lesson ${l.lesson}</span></div>
    <h2>${l.section?esc(l.section)+' · ':''}${esc(l.title)}</h2>
    ${nests(l)}
    ${l.keyKnowledge?.length?`<h3>Key knowledge</h3>${list(l.keyKnowledge)}`:''}
    ${l.prac?pracBox(l.prac):''}
    ${pearsonPane(l)}
  </div><div class="seq">${seqPane(l)}</div></div>`}
function renderClass(c){
  const d=data[c.id],sel=$('#aosFilter'),f=sel.value;
  const aosList=[...new Set(d.lessons.map(l=>l.aos))];
  sel.innerHTML='<option value="">All areas of study</option>'+aosList.map(a=>`<option ${a==f?'selected':''}>${a}</option>`).join('');
  const L=d.lessons.filter(l=>!f||l.aos==f);
  const pr=d.lessons.filter(l=>l.type=='prac').length;
  let h=`<div class="unit">${esc(d.unitLabel||'Unit 1')} <span class="scope">· ${esc(d.scope)} · ${d.summary?esc(d.summary):`${d.weeksPerUnit} weeks × ${d.lessonsPerWeek} lessons × ${d.lessonMinutes} min · ${pr} prac lessons ≈ ${(pr*d.lessonMinutes/60).toFixed(1)} h`}</span></div>
    <div class="legend">${['lesson','prac','review','sac','holiday'].map(k=>`<span class="t-${k}"><i></i>${TYPE[k]}</span>`).join('')}<span><i style="background:#8a6ad8"></i>CFAT</span></div>`;
  let lastA='';
  for(const w of [...new Set(L.map(l=>l.week))]){
    const W=L.filter(l=>l.week==w);
    if(W[0].aos!=lastA){lastA=W[0].aos;h+=`<div class="aos"><b>${esc(lastA)}</b><span>${esc(W[0].aosTitle)}</span></div>`}
    h+=`<div class="week"><div class="wl"><b>${esc(W[0].weekLabel||'Week '+w)}</b>${esc(W[0].termLabel||'Semester 1')}${W[0].dates?`<span class="wdates">${esc(W[0].dates)}</span>`:''}</div>`;
    for(const l of W)h+=`<div class="card t-${l.type} ${l.span==3?'span3':''} ${cfs(l).length?'has-cfat':''} ${openId==l.id?'open':''}" data-id="${l.id}">
      <div class="meta"><span>L${l.lesson}${l.section?' · '+esc(l.section):''}</span><span class="tags">${cfs(l).length?`<span class="tag cfat">${cfs(l).length>1?cfs(l).length+' CFATs':'CFAT'}</span>`:''}<span class="tag">${TYPE[l.type]}</span></span></div>
      <div class="ttl">${esc(l.title)}</div></div>`;
    W.filter(l=>expandAll||l.id==openId).forEach(l=>h+=detail(l));
    h+='</div>';
  }
  $('#main').innerHTML=h;
  $('#main').querySelectorAll('.card').forEach(el=>el.onclick=()=>{openId=openId==el.dataset.id?null:el.dataset.id;renderClass(c)});
  $('#main').querySelectorAll('.detail').forEach(dv=>{const id=dv.dataset.for;
    dv.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{const s=state(id);s.done=s.done||{};s.done[cb.dataset.i]=cb.checked;setState(id,s);renderClass(c)});
    dv.querySelectorAll('[data-nest]').forEach(n=>n.ontoggle=()=>store.set('nest:'+n.dataset.nest,n.open));
    dv.querySelectorAll('.yt[data-yt]').forEach(bt=>bt.onclick=()=>{bt.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${bt.dataset.yt}?autoplay=1${bt.dataset.start?'&start='+bt.dataset.start:''}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;bt.onclick=null;bt.style.cursor='default';bt.classList.add('on')});
    const ta=dv.querySelector('[data-notes]');if(ta)ta.oninput=()=>{const s=state(id);s.notes=ta.value;setState(id,s)};});
  typeset();
}
function taskList(arr,empty){if(!arr||!arr.length)return `<div class="empty">${empty}</div>`;
  return '<ul>'+arr.map(t=>`<li>${link(t)} <span class="src src-pearson">${esc(t.source||'')}</span>${t.solutions?` <span class="sub">· ${link(t.solutions)}</span>`:' <span class="sub nosol">· no solutions</span>'}${t.path?`<span class="path" style="display:block;font-size:11px;color:var(--muted)">${esc(t.path)}</span>`:''}</li>`).join('')+'</ul>'}
function renderAssessment(c){
  const a=data[c.id].assessment;
  let h=`<div class="unit">Assessment plan · ${esc(data[c.id].unitLabel||'Unit 1')}</div><div class="arules"><h3>The rules (${esc(a.rulesTitle||'VCE Physics Study Design')})</h3>${list(a.rules)}
    <details><summary>Suitable assessment task types</summary>${list(a.suitableTasks)}</details></div>`;
  for(const x of a.aos)h+=`<div class="acard"><div class="ahead"><div><b>${esc(x.aos)}</b> · ${esc(x.title)}</div><button class="goto" data-id="${x.when.id}">${esc(data[c.id].lessons.find(l=>l.id==x.when.id)?.weekLabel||'Week '+x.when.week)} · Lesson ${x.when.lesson}</button></div>
    <div class="agrid"><div><h3>Outcome</h3><p>${esc(x.outcome)}</p><h3>What students do</h3><p>${esc(x.task)}</p><div class="sub">Task type: ${esc(x.taskType)}</div>
      ${x.pearsonNote?`<h3>Pearson</h3><p class="sub">${esc(x.pearsonNote)}</p>`:''}${x.gaps.length?`<h3>To do</h3><ul class="gaps">${x.gaps.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>`:''}</div>
    <div><h3>Practice</h3>${taskList(x.practice,'None yet')}<h3>Actual task</h3>${taskList(x.actual,'Not written yet')}<h3>Redemption</h3>${taskList(x.redemption,'Not written yet')}<h3>Models for writing the SAC</h3>${taskList(x.models,'None')}</div></div></div>`;
  for(const e of a.exams)h+=`<div class="acard"><div class="ahead"><div><b>${esc(e.name)}</b> · ${esc(e.covers)}</div><span class="sub">${esc(e.when)}</span></div>
    <div class="agrid"><div><h3>Practice</h3>${taskList(e.practice,'None yet')}</div><div><h3>Actual exam</h3>${taskList(e.actual,'Not written yet')}</div></div></div>`;
  $('#main').innerHTML=h;
  $('#main').querySelectorAll('.goto').forEach(b=>b.onclick=()=>{view='plan';store.set('view',view);openId=b.dataset.id;render();setTimeout(()=>document.querySelector(`[data-id="${b.dataset.id}"]`)?.scrollIntoView({block:'center'}),50)});
}
function cfatList(c){const d=data[c.id];
  return [...d.lessons.flatMap(l=>cfs(l).map(c=>({...c,lessonId:l.id,when:`${l.weekLabel||'Week '+l.week} · Lesson ${l.lesson}`}))),...(d.cfats||[])]}
function renderCfats(c){
  const C=cfatList(c),st0=store.get('cfat:'+c.id,{}),st={};C.forEach(x=>st[x.id]={status:/^written/i.test(x.status||'')?'written':'planned',...st0[x.id]});
  let h=`<div class="unit">CFATs · ${esc(data[c.id].unitLabel||'Unit 1')} <span class="scope">· ${C.length} planned</span></div>`;
  if(!C.length){$('#main').innerHTML=h+'<div class="placeholder"><h2>No CFATs planned yet</h2>CFATs added to this class’s lessons will be listed here, with status and notes for each.</div>';return}
  const n=k=>C.filter(x=>(st[x.id]?.status||'planned')==k).length;
  h+=`<div class="legend"><span class="st-planned">Planned: ${n('planned')}</span><span class="st-drafting">Drafting: ${n('drafting')}</span><span class="st-written">Written: ${n('written')}</span></div>
  <table class="ctable"><tr><th>CFAT</th><th>When</th><th>Covers</th><th>Format &amp; plan</th><th>Status</th><th style="width:22%">Notes</th></tr>`;
  for(const x of C){const s=st[x.id]||{};
    h+=`<tr><td><b>${esc(x.id)}</b><div class="sub">${esc(x.title)}</div></td>
    <td>${x.lessonId?`<button class="goto" data-id="${x.lessonId}">${esc(x.when)}</button>`:esc(x.when||'Not scheduled')}</td>
    <td>${esc((x.covers||[]).join(', '))}</td>
    <td><div class="sub">${esc(x.format||'')}</div>${x.plan||x.sources?.length?`<details><summary>Plan &amp; sources</summary><div>${esc(x.plan||'')}</div>${x.sources?.length?list(x.sources):''}</details>`:''}</td>
    <td><select data-cid="${esc(x.id)}" class="st-${s.status||'planned'}">${['planned','drafting','written'].map(k=>`<option value="${k}" ${(s.status||'planned')==k?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select></td>
    <td><textarea data-cnote="${esc(x.id)}" placeholder="Notes">${esc(s.notes||'')}</textarea></td></tr>`}
  $('#main').innerHTML=h+'</table>';
  const save=(id,k,v)=>{const S=store.get('cfat:'+c.id,{});S[id]={...S[id],[k]:v};store.set('cfat:'+c.id,S)};
  $('#main').querySelectorAll('[data-cid]').forEach(el=>el.onchange=()=>{save(el.dataset.cid,'status',el.value);renderCfats(c)});
  $('#main').querySelectorAll('[data-cnote]').forEach(el=>el.oninput=()=>save(el.dataset.cnote,'notes',el.value));
  $('#main').querySelectorAll('.goto').forEach(b=>b.onclick=()=>{view='plan';store.set('view',view);openId=b.dataset.id;render();setTimeout(()=>document.querySelector(`[data-id="${b.dataset.id}"]`)?.scrollIntoView({block:'center'}),50)});
}
function render(){
  renderTabs();
  const show=tab!='schedule';$('#subbar').style.display=show?'':'none';$('#ctl').style.display=show&&view=='plan'?'flex':'none';
  if(!show){$('#main').innerHTML='<div class="placeholder"><h2>Schedule</h2>All classes merged into one weekly timetable will appear here once more classes and your timetable are added.</div>';return}
  const c=CLASSES.find(c=>c.id==tab)||CLASSES[0];
  $('#viewtog').innerHTML=`<button data-v="plan" class="${view=='plan'?'on':''}">Unit plan</button><button data-v="assess" class="${view=='assess'?'on':''}">Assessment plan</button><button data-v="cfat" class="${view=='cfat'?'on':''}">CFATs</button>`;
  $('#viewtog').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;store.set('view',view);render()});
  view=='assess'?renderAssessment(c):view=='cfat'?renderCfats(c):renderClass(c);
}
$('#aosFilter').onchange=()=>render();
$('#expand').onclick=()=>{expandAll=!expandAll;$('#expand').textContent=expandAll?'Collapse all':'Expand all';render()};
window.addEventListener('load',typeset);
Promise.all(CLASSES.map(c=>fetch(c.file).then(r=>r.json()).then(j=>data[c.id]=j))).then(render)
  .catch(e=>{$('#main').innerHTML='<div class="placeholder">Could not load class data.</div>'});
</script>
</body>
</html>
